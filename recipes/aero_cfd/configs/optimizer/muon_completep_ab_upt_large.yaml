kind: noether.core.optimizer.MuonComposite
lr: 0.01
momentum: 0.95
weight_decay: 0.01
secondary:
  kind: noether.core.optimizer.Lion
  lr: 5.0e-5
  weight_decay: 0.05
clip_grad_norm: 1.0
param_group_modifiers_config:
  - kind: noether.core.optimizer.param_group_modifiers.completep.CompletePModifier
    optimizer_type: muon
    width_multiplier: 2.0         # 512 / 256
    depth_multiplier: 2.1667      # 13 / 6 (geometry:1 + physics:10 + decoder:2)
    depth_alpha_exp: 1.0
    base_weight_decay: 0.01
    hidden_param_substrings:
      - "physics_blocks."
      - "geometry_blocks."
      - "domain_decoder_blocks."
schedule_config:
  kind: noether.core.schedules.LinearWarmupCosineDecaySchedule
  warmup_percent: 0.05
  end_value: 1.0e-6
  max_value: ${model.optimizer_config.lr}
