name: CUDA Tests (Flash Attention)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/noether/modeling/modules/attention/**"
      - ".github/workflows/cuda-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-tests:
    name: CUDA Flash Attention Tests
    runs-on: [self-hosted, linux, GPU]  # Requires a self-hosted runner with CUDA GPUs
    # Alternative: Use a cloud service like [CircleCI](https://circleci.com/) or [GitHub's GPU runners](https://github.com/actions/runner-images/issues/2840) (not yet natively supported)
    # For public repos, consider [MATLAB's GPU-enabled runners](https://github.com/matlab-actions/setup-matlab) or [NVIDIA's CUDA containers](https://hub.docker.com/r/nvidia/cuda)
    timeout-minutes: 60

    container:
      image: nvidia/cuda:12.3.2-devel-ubuntu22.04  # CUDA 12.3 (required for FA3)
      options: --gpus all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (with cache)
        id: setup-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          
      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Show env (brief)
        run: |
          python -V
          uv pip list | head -n 200

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch with CUDA
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu121

      - name: Install Flash Attention 3 (Hopper)
        run: |
          git clone https://github.com/Dao-AILab/flash-attention.git
          cd flash-attention/hopper
          python setup.py install
          cd ../..
          rm -rf flash-attention

      - name: Install kernels (optional)
        run: |
            uv sync --extra kernels    

      - name: Install Noether
        run: |
          pip install -e .

      - name: Run Flash Attention Tests
        env:
          NOETHER_ATTN_IMPL: "flash-attention-3"  # Test FA3
        run: |
          uv run --no-sync pytest \
            tests/unit/noether/modeling/modules/attention/test_dot_product.py \
            tests/unit/noether/modeling/modules/attention/test_perceiver.py \
            --maxfail=1 --disable-warnings \
            -v \
            -m "gpu"  # Mark GPU tests with @pytest.mark.gpu

      - name: Run kernels Flash Attention Tests
        env:
          NOETHER_ATTN_IMPL: "kernels/flash-attn3"  # Test kernels
        run: |
          uv run --no-sync pytest \
            tests/unit/noether/modeling/modules/attention/test_dot_product.py \
            --maxfail=1 --disable-warnings \
            -v \
            -m "gpu"

      - name: Run SDPA Fallback Tests
        env:
          NOETHER_ATTN_IMPL: "sdpa"  # Test fallback
        run: |
          uv run --no-sync pytest \
            tests/unit/noether/modeling/modules/attention/test_dot_product.py \
            --maxfail=1 --disable-warnings \
            -v \
            -m "gpu"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-test-results
          path: |
            pytest.xml
            *.log