# @package _global_

dataset_kind: boilerplate_project.datasets.BaseDataset
config_schema_kind: boilerplate_project.schemas.BoilerplateConfigSchema

# Shared dimension value — referenced via ${input_dim} in model and trainer configs.
input_dim: 2

defaults:
  - model: base_model
  - datasets: base_dataset
  - tracker: base_tracker
  - callbacks: base_callback
  - trainer: base_trainer
  - optim: adamw
  - _self_

output_path: ./outputs
